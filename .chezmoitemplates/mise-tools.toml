{{- /* mise's [tools] table for this host, from .chezmoidata/packages.yaml.
       Pass the template data as `.`. */ -}}
# Generated from .chezmoidata/packages.yaml by chezmoi -- edit there, not here.
# Every tool without `system: true` lands below; the rest come from this
# machine's package manager via chezmoi's package script.
#
# Installed by .chezmoiscripts/run_onchange_after_20-mise.sh.tmpl.

[tools]
{{- range .tools }}
{{-   if and (not (dig "system" false .)) (or (not (hasKey . "hosts")) (has $.host .hosts)) }}
{{-     $v := dig "version" "latest" . }}
{{-     if kindIs "map" $v }}{{ $v = dig $.host (dig "default" "latest" $v) $v }}{{ end }}
{{ dig "mise" .cmd . | quote }} = {{ $v | quote }}
{{-   end }}
{{- end }}
