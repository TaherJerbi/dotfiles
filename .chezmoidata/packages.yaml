# What this repo's configs need, and where each piece comes from. Consumed by
# .chezmoiscripts/run_onchange_before_10-packages.sh.tmpl (system packages),
# .chezmoiscripts/run_onchange_after_20-mise.sh.tmpl (everything mise carries,
# via /etc/mise/config.toml), and
# dot_config/setup/executable_doctor.sh.tmpl (report only).

# Keyed by .pkgfamily, and now only for the handful of tools mise has no
# entry for: a C toolchain, a login shell, a GUI terminal.
packagemanagers:
  brew:
    name: brew
    install: brew install
    installcask: brew install --cask
  arch:
    name: pacman
    install: sudo pacman -S --needed --noconfirm
  debian:
    name: apt
    install: sudo apt-get install -y
    refresh: sudo apt-get update
  fedora:
    name: dnf
    install: sudo dnf install -y
  suse:
    name: zypper
    install: sudo zypper install -y
  alpine:
    name: apk
    install: sudo apk add

# mise installs a tool unless it says `system: true`, and knows it by `cmd`
# unless `mise` overrides that name -- so most entries are one line.
#
#   cmd         what must end up on PATH
#   system      mise has no entry for it; the package manager provides it, and
#               pkg/cask apply. Check with `mise registry <cmd>` before adding.
#   mise        mise's name for it, where that differs from cmd. May be a
#               backend spec (ubi:owner/repo) to bypass the registry.
#   version     what to pin it to in mise.toml; "latest" if absent
#   deps        other tools here that this one needs at runtime
#   hosts       machine identities to install it on; everywhere if absent
#   pkg         package name where it differs from cmd, by family
#   cask        a Homebrew cask rather than a formula
#   minversion  floor this repo's configs assume; reported by doctor.sh, not
#               enforced -- mise's `latest` clears every floor we have
tools:
  # --- not in mise's registry ----------------------------------------------
  - cmd: git
    system: true
  - cmd: make
    system: true
  - cmd: unzip
    system: true
  - cmd: cc
    system: true
    pkg:
      default: gcc
  - cmd: fish
    system: true
    deps: [lazygit, zoxide]
    hosts: [macos, cachyos]
  - cmd: alacritty
    system: true
    cask: true
    hosts: [macos, cachyos]

  # --- mise-managed ---------------------------------------------------------
  - cmd: rg
    mise: ripgrep
  - cmd: fd
  - cmd: lazygit
  - cmd: zoxide
  - cmd: nvim
    mise: neovim
    deps: [git, make, unzip, cc, rg, fd, lazygit, tree-sitter]
    # Below 0.12 init.lua aborts with "Invalid 'event': 'PackChanged'".
    minversion: "0.12"
  - cmd: tree-sitter
  - cmd: fzf
  - cmd: jq
  - cmd: eza
  - cmd: bat
  - cmd: herdr
    deps: [zoxide, fzf, jq, eza, bat]
    hosts: [macos, cachyos]
