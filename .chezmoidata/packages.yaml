# What this repo's configs need, and how to install it. Consumed by
# .chezmoiscripts/run_onchange_before_10-packages.sh.tmpl and
# dot_config/setup/executable_doctor.sh.tmpl; editing it re-runs the former.

# Keyed by .pkgfamily. `install` takes the package names as arguments;
# `refresh` runs once beforehand.
packagemanagers:
  brew:
    name: brew
    install: brew install
    installcask: brew install --cask
  arch:
    name: pacman
    install: sudo pacman -S --needed --noconfirm
  debian:
    name: apt
    install: sudo apt-get install -y
    refresh: sudo apt-get update
  fedora:
    name: dnf
    install: sudo dnf install -y
  suse:
    name: zypper
    install: sudo zypper install -y
  alpine:
    name: apk
    install: sudo apk add

#   cmd         what must end up on PATH
#   deps        other tools here that this one needs at runtime
#   hosts       machine identities to install it on; everywhere if absent
#   pkg         package name where it differs from cmd
#   manual      families whose repos don't carry it (or carry it too old)
#   release     GitHub release to install from instead, for those families
#   installer   upstream's own install command, used in place of release
#   minversion  reinstall if what's on PATH is older than this
#   cask        a Homebrew cask rather than a formula
#   alt         another binary name that counts as having it
#
# release.asset and release.bin take {version}, {plainversion} (no leading v)
# and {arch}, the latter mapped through release.arch by .chezmoi.arch.
# release.bin names the binary inside the archive; without it the download is
# the bare binary. Bump release.version by hand.
tools:
  - cmd: git
  - cmd: make
  - cmd: unzip
  - cmd: cc
    pkg:
      default: gcc
  - cmd: rg
    pkg:
      default: ripgrep
  - cmd: fd
    # Debian ships the binary as fdfind, to avoid clashing with fdclone.
    pkg:
      debian: fd-find
      fedora: fd-find
    alt: fdfind
  - cmd: lazygit
    manual: [debian]
    release:
      version: v0.64.1
      url: https://github.com/jesseduffield/lazygit/releases/download/{version}/lazygit_{plainversion}_linux_{arch}.tar.gz
      bin: lazygit
      arch:
        amd64: x86_64
        arm64: arm64
  - cmd: zoxide
  - cmd: nvim
    deps: [git, make, unzip, cc, rg, fd, lazygit, tree-sitter]
    pkg:
      default: neovim
    # Below 0.12 init.lua aborts with "Invalid 'event': 'PackChanged'".
    minversion: "0.12"
    manual: [debian]
    release:
      version: v0.12.5
      url: https://github.com/neovim/neovim/releases/download/{version}/nvim-linux-{arch}.tar.gz
      # Needs its runtime files alongside, so the whole tree is kept.
      bin: nvim-linux-{arch}/bin/nvim
      arch:
        amd64: x86_64
        arm64: arm64
  - cmd: tree-sitter
    # brew splits the CLI out of the 'tree-sitter' formula.
    pkg:
      default: tree-sitter-cli
    manual: [debian, fedora, suse, alpine]
    release:
      version: v0.27.0
      url: https://github.com/tree-sitter/tree-sitter/releases/download/{version}/tree-sitter-linux-{arch}.gz
      arch:
        amd64: x64
        arm64: arm64
  - cmd: fish
    deps: [lazygit, zoxide]
    hosts: [macos, cachyos]
  - cmd: alacritty
    cask: true
  - cmd: fzf
  - cmd: jq
  - cmd: eza
  - cmd: bat
    # Debian ships the binary as batcat, to avoid clashing with bacula-console.
    alt: batcat
  - cmd: herdr
    deps: [zoxide, fzf, jq, eza, bat]
    hosts: [macos, cachyos]
    manual: [arch, debian, fedora, suse, alpine]
    installer: curl -fsSL https://herdr.dev/install.sh | sh
